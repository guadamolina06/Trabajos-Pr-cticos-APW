<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="./recursos/estilos/index.css">
</head>
<body>
  <header class="encabezado-principal">
        <div  class="logo">
            <a href="index.html">
                <strong>Dental Pro</strong>
          </a>
        </div> 
        <nav aria-label="Navegación principal" class="vinculo"> 
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>
               <li>
                 <a href="productos.html">Productos</a>
               </li>
               <li>
                 <a href="productos.html">Catálogo</a>
               </li>
               <li>
                  <a href="sobrenosostros.html">Sobre Nosotros                    
                  </a>
               </li>
                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>
        <div class="carrito">
            <a href="./carrito.html" >
                <strong>🛒</strong>
            </a>
        </div>
    </header>
    <main class="contenido-contacto">
         <h1>Contacto</h1>

        <p>
            Si tenés alguna consulta sobre nuestros productos,
            podés comunicarte con nosotros.
        </p>
        <form action="./contacto.html" method="post">
            <div>

                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required>

            </div>
            <div>

                <label for="email">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>

            </div>
            <div>

                <label for="mensaje">
                    Mensaje:
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                    required></textarea>

            </div>


            <button type="submit">
                Enviar mensaje
            </button>

        </form>
    </main>
    <footer class="pie-principal">

        <p>
            &copy; 2026 DentalPro.
        </p>

    </footer>
</body>
</html>
