    <main>
         <h1>Contacto</h1>

        <p>
            Si tenés alguna consulta sobre nuestros productos,
            podés comunicarte con nosotros.
        </p>


        <form action="./contacto.html" method="post">

            <div>

                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required>

            </div>


            <div>

                <label for="email">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>

            </div>


            <div>

                <label for="mensaje">
                    Mensaje:
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                    required></textarea>

            </div>


            <button type="submit">
                Enviar mensaje
            </button>

        </form>

    </main>
