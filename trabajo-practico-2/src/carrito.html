<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | DentalPro</title>
    <link rel="stylesheet" href="./recursos/estilos/index.css">
    <script type="module" src="./recursos/javascript/paginaCarrito.js"></script>
</head>
<body>
     <header class="encabezado-principal">
        <div  class="logo">
            <a href="index.html">
                <strong>Dental Pro</strong>
          </a>
        </div> 
        <nav aria-label="Navegación principal" class="vinculo"> 
            <ul>
                <li>
                    <a href="./index.html">Inicio</a>
                </li>
               <li>
                 <a href="productos.html">Productos</a>
               </li>
                 
               <li>
                  <a href="sobrenosostros.html">Sobre Nosotros                    
                  </a>
               </li>
                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
            </ul>
        </nav>
        <div class="carrito">
            <a href="./carrito.html" >
                <strong>🛒</strong>
            </a>
        </div>
    </header>
    <main>
        <h1>Carrito de compras</h1>
        <div class="contenido-carrito">
                <section class="section-productos" aria-labelledby="productos-carrito">
                 <h2 id="productos-carrito">Productos seleccionados</h2>
                 <div id="listaCarrito">
                 </div>
                </section>

                <section class="section-resumen" aria-labelledby="resumen">
                 <h2 id="resumen">Resumen del pedido</h2>
                 <p>Unidades: <span id="unidadesCarrito">0</span>
                 </p>
                 <p>Envío: a coordinar</p>
                 <p><strong>Total: <span id="totalCarrito">$0</span></strong></p>
                 <form id="formPedido">
                    <label for="nombreCliente">Tu nombre:</label>
                    <input type="text" id="nombreCliente" name="nombreCliente" required minlength="3"
                    placeholder="Ej: Sofía Martínez">
                    <button type="submit" id="btnConfirmar">Confirmar pedido por WhatsApp</button>
                 </form>
                    <button type="button" id="btnVaciar" class="btn-secundario">Vaciar carrito</button>
                </section>
        </div>

        <p class="btn-carrito">
            <a href="productos.html">← Continuar comprando</a>
        </p>
    </main>
   <footer class="pie-principal">
            <p>
                &copy; 2026 DentalPro.
            </p>
  </footer>
</body>
</html>
