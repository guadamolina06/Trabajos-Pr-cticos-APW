name: CI/CD DentalPro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trabajo-practico-2
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correr los tests
        run: node --test tests/carrito.test.js tests/filtros.test.js

  deploy:
    name: Deploy a Vercel
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Traer la configuración de producción
        run: vercel pull --yes --environment=production

      - name: Construir
        run: vercel build --prod

      - name: Publicar en producción
        run: vercel deploy --prebuilt --prod